<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>하회지점 · 서비스 종료 안내</title>
<meta name="theme-color" content="#F37321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하회지점">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #1a0f2e 0%, #0a0a0a 70%);
    color: white;
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    max-width: 400px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(252,211,77,0.18) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 40px 28px 36px;
    background: linear-gradient(160deg, rgba(26,26,26,0.9) 0%, rgba(45,27,78,0.7) 100%);
    border: 1px solid rgba(252,211,77,0.25);
    border-radius: 24px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      0 0 40px rgba(252,211,77,0.08);
    backdrop-filter: blur(10px);
  }
  .emoji {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 8px 24px rgba(252,211,77,0.35));
    animation: floatY 3s ease-in-out infinite;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .tag {
    font-size: 10.5px;
    font-weight: 900;
    color: #FCD34D;
    letter-spacing: 0.3em;
    margin-top: 20px;
  }
  h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.03em;
    margin-top: 8px;
    line-height: 1.3;
    background: linear-gradient(135deg, #FFF8DC 0%, #FCD34D 60%, #D97706 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .divider {
    width: 44px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FCD34D, transparent);
    margin: 22px auto;
    opacity: 0.7;
  }
  .msg {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    letter-spacing: -0.02em;
    line-height: 1.7;
  }
  .msg .strong {
    font-weight: 900;
    color: white;
  }
  .msg .highlight {
    color: #FCD34D;
    font-weight: 900;
  }
  .comeback {
    margin-top: 24px;
    padding: 14px 16px;
    background: rgba(252,211,77,0.08);
    border: 1px dashed rgba(252,211,77,0.4);
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    color: #FCD34D;
    letter-spacing: -0.02em;
  }
  .comeback .v2 {
    display: inline-block;
    background: linear-gradient(135deg, #FCD34D, #F37321);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .signature {
    margin-top: 26px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    letter-spacing: -0.01em;
  }
  .signature .brand {
    color: rgba(252,211,77,0.7);
    font-weight: 900;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="content">
      <div class="emoji">🙏</div>
      <div class="tag">SERVICE CLOSED</div>
      <h1>서비스가 종료되었습니다</h1>
      <div class="divider"></div>
      <div class="msg">
        <div><span class="strong">그동안의 성원에</span></div>
        <div><span class="highlight">진심으로 감사드립니다.</span></div>
      </div>
      <div class="comeback">
        재정비 후<br>
        <span class="v2">VERSION 2</span>로 돌아오겠습니다
      </div>
      <div class="signature">
        HAHOE BRANCH<br>
        <span class="brand">심현우 지점장</span>
      </div>
    </div>
  </div>
</body>
</html>
